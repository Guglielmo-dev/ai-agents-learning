services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: radar-aspire-dashboard
    ports:
      - "127.0.0.1:18888:18888" # UI web della dashboard, accessibile solo dal PC locale
      - "127.0.0.1:4317:18889"  # OTLP/gRPC per l'API avviata da Visual Studio
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true" # Accesso diretto senza token in locale

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: radar-sqlserver-compose
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RadarPass2026!"
    ports:
      - "1433:1433"
    volumes:
      - radar_compose_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P RadarPass2026! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar-agent-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      # Sovrascrive appsettings.json: punta al servizio 'sqlserver' del compose
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RadarAgentDb;User Id=sa;Password=RadarPass2026!;TrustServerCertificate=True;"
      # Punta a Ollama in esecuzione sul PC host Windows
      Ollama__BaseUrl: "http://host.docker.internal:11434/"
      # Tra container si usa il nome del servizio e la sua porta interna.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    depends_on:
      aspire-dashboard:
        condition: service_started
      sqlserver:
        condition: service_healthy

volumes:
  radar_compose_data:
